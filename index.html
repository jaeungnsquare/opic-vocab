<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오픽 단어장">
<meta name="theme-color" content="#EEEFF1">
<title>오픽 단어장</title>
<style>
:root{
  --paper:#EEEFF1;--card:#FFF;--ink:#191F2B;--mute:#77808F;
  --film:#D8342A;--line:#DFE1E5;--ok:#2C7358;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  overscroll-behavior-y:none;
}
#app{
  max-width:440px;margin:0 auto;
  padding:0 16px calc(44px + env(safe-area-inset-bottom));
  min-height:100dvh;
}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation;min-height:44px;cursor:pointer}
input,textarea{font-family:var(--sans);font-size:16px}

/* 헤더 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(14px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;background:var(--paper);z-index:5}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;white-space:nowrap}
.chip{width:12px;height:17px;background:var(--film);border-radius:2px;flex:none}
.bar nav{display:flex;gap:2px}
.bar nav button{border:0;background:none;font-size:13px;color:var(--mute);
  padding:8px 11px;border-radius:8px;min-height:40px}
.bar nav button.on{background:var(--ink);color:#fff}

.pane{display:flex;flex-direction:column;gap:13px}
.lead{font-size:13px;color:var(--mute);line-height:1.6}

.today{background:var(--card);border-radius:14px;padding:24px 20px}
.count{font-family:var(--serif);font-size:54px;line-height:1;letter-spacing:-.02em}
.count span{font-family:var(--sans);font-size:14px;font-weight:500;margin-left:7px;color:var(--mute)}
.today-sub{margin-top:9px;font-size:13px;color:var(--mute);line-height:1.6}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mute);
  padding:9px 13px;border-radius:20px;min-height:40px}
.chipbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chipbtn b{font-weight:400;opacity:.6;margin-left:4px;font-size:11px}

.stats{display:flex;gap:7px}
.stats div{flex:1;background:var(--card);border-radius:11px;padding:13px 6px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:23px;font-weight:500}
.stats span{font-size:11px;color:var(--mute)}

.go{border:0;background:var(--ink);color:#fff;font-size:16px;font-weight:500;
  padding:16px;border-radius:11px;width:100%}
.go[disabled]{opacity:.4}
.go.sm{padding:13px;font-size:15px;margin-top:14px}
.ghost{border:0;background:none;font-size:13px;color:var(--mute);padding:10px 2px;
  text-decoration:underline;text-underline-offset:3px}
.last{font-size:12px;color:var(--mute);text-align:center}
.msg{font-size:13px;text-align:center;color:var(--ok)}
.msg.warn{color:var(--film)}

.progress{display:flex;align-items:center;gap:10px}
.track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--film);transition:width .25s ease}
.progress span{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}

.card{background:var(--card);border-radius:16px;padding:26px 20px;border:2px solid transparent}
.card.right{border-color:var(--ok)}
.card.wrong{border-color:var(--film)}
.pos{font-size:11px;color:var(--mute);margin-bottom:14px}
.wordrow{display:flex;align-items:flex-start;gap:10px}
.word{font-family:var(--serif);font-size:36px;line-height:1.14;letter-spacing:-.01em;
  word-break:break-word;flex:1}
.spk{border:0;background:none;font-size:19px;padding:2px 4px;min-height:36px;line-height:1;opacity:.5}
.kmean{font-size:19px;font-weight:500;line-height:1.5}
.kmean.red{color:var(--film)}
.hint{font-family:var(--serif);font-size:20px;color:var(--mute);letter-spacing:.16em;
  margin-top:10px;word-break:break-all}

.sheet-wrap{position:relative;margin-top:18px;-webkit-user-select:none;user-select:none}
.sheet{position:absolute;inset:-9px -10px;background:var(--film);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s}
.sheet span{color:rgba(255,255,255,.93);font-size:12px}
.sheet.off{transform:translateX(102%);opacity:0;pointer-events:none}

.choices{display:flex;flex-direction:column;gap:7px;margin-top:18px}
.choice{border:1px solid var(--line);background:#fff;font-size:14.5px;text-align:left;
  padding:14px 15px;border-radius:9px;line-height:1.45;min-height:50px;width:100%}
.choice.right{border-color:var(--ok);background:#EDF5F1;color:var(--ok)}
.choice.wrong{border-color:var(--film);background:#FBEDEC;color:var(--film)}

.spell{width:100%;border:0;border-bottom:2px solid var(--line);background:none;
  font-family:var(--serif);font-size:24px;padding:9px 0;margin-top:16px;outline:none;
  color:var(--ink);border-radius:0;-webkit-appearance:none}
.spell:focus{border-color:var(--ink)}
.answer{font-family:var(--serif);font-size:19px;color:var(--film);margin-top:12px}

.ex{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.ex-en{font-family:var(--serif);font-size:16.5px;line-height:1.55}
.ex-ko{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.6}
.ex-en.small{font-size:14px;margin-top:8px}
.ex-ko.small{font-size:12px}

.judge{display:flex;gap:7px}
.judge button{flex:1;border:0;font-size:14.5px;padding:15px 8px;border-radius:11px}
.miss{background:#FBEDEC;color:var(--film)}
.hit{background:#EDF5F1;color:var(--ok)}

.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:12px 14px;outline:none;-webkit-appearance:none}
.list{list-style:none;padding:0;margin:0;background:var(--card);border-radius:13px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.list summary{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 15px;list-style:none;min-height:52px;cursor:pointer}
.list summary::-webkit-details-marker{display:none}
.lw{font-family:var(--serif);font-size:17.5px;line-height:1.25}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.tg{font-size:10.5px;color:var(--mute);background:#F2F3F5;padding:3px 7px;border-radius:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.b1{background:#F0C9C6}.dot.b2{background:#E8A09B}.dot.b3{background:#B9CFC4}
.dot.b4{background:#79AE97}.dot.b5{background:var(--ok)}
.list details[open]{padding-bottom:14px}
.list details p{padding:0 15px}
.lm{font-size:14px;font-weight:500}
.lact{display:flex;gap:16px;padding:0 15px}
.more{text-align:center;font-size:12px;color:var(--mute);padding:12px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mute)}
.field input,.field textarea{border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:12px 14px;outline:none;-webkit-appearance:none}
.field textarea{min-height:120px;line-height:1.6;resize:vertical}
.divider{border-top:1px solid var(--line);margin:6px 0}

@media (max-width:360px){.word{font-size:31px}.count{font-size:46px}}
@media (prefers-reduced-motion:reduce){.sheet,.fill{transition:none}}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const WORDS = [
// ── 일상 ──
["run errands","표현","볼일을 보다, 잡일을 처리하다","I run errands on Saturday mornings.","나는 토요일 아침에 볼일을 본다.","일상"],
["do the dishes","표현","설거지를 하다","We take turns doing the dishes.","우리는 번갈아 가며 설거지를 한다.","일상"],
["do the laundry","표현","빨래를 하다","I do the laundry twice a week.","나는 일주일에 두 번 빨래를 한다.","일상"],
["tidy up","표현","정리하다, 치우다","I tidy up my desk before work.","나는 일하기 전에 책상을 정리한다.","일상"],
["household chores","명사","집안일","We split the household chores evenly.","우리는 집안일을 공평하게 나눈다.","일상"],
["commute","동사","통근하다, 통학하다","I commute about forty minutes each way.","나는 편도로 40분 정도 통근한다.","일상"],
["wind down","표현","긴장을 풀다, 하루를 마무리하다","I wind down by listening to music.","나는 음악을 들으며 하루를 마무리한다.","일상"],
["sleep in","표현","늦잠을 자다","On weekends I like to sleep in.","주말에는 늦잠 자는 걸 좋아한다.","일상"],
["grab a bite","표현","간단히 먹다","Let's grab a bite before the movie.","영화 보기 전에 간단히 먹자.","일상"],
["stay up late","표현","늦게까지 안 자다","I stayed up late finishing the report.","보고서를 끝내느라 늦게까지 깨어 있었다.","일상"],
["get ready","표현","준비하다","It takes me twenty minutes to get ready.","준비하는 데 20분쯤 걸린다.","일상"],
["set an alarm","표현","알람을 맞추다","I set an alarm for six thirty.","나는 6시 30분에 알람을 맞춘다.","일상"],
["hit the snooze button","표현","알람을 미루다","I hit the snooze button way too often.","나는 알람을 너무 자주 미룬다.","일상"],
["take out the trash","표현","쓰레기를 내다 버리다","I take out the trash every other night.","나는 이틀에 한 번 쓰레기를 버린다.","일상"],
["make the bed","표현","잠자리를 정리하다","I make the bed as soon as I wake up.","나는 일어나자마자 잠자리를 정리한다.","일상"],
["water the plants","표현","화분에 물을 주다","I water the plants on Sundays.","나는 일요일에 화분에 물을 준다.","일상"],
["grocery shopping","명사","장보기","I do grocery shopping once a week.","나는 일주일에 한 번 장을 본다.","일상"],
["take a nap","표현","낮잠을 자다","I sometimes take a short nap after lunch.","점심 후에 가끔 짧게 낮잠을 잔다.","일상"],
["freshen up","표현","씻고 단장하다","Give me a minute to freshen up.","잠깐 씻고 나올게요.","일상"],
["head out","표현","나서다, 출발하다","I usually head out around eight.","나는 보통 8시쯤 나선다.","일상"],
["get off work","표현","퇴근하다","I get off work at six.","나는 6시에 퇴근한다.","일상"],
["on my way home","표현","집에 가는 길에","I picked it up on my way home.","집에 가는 길에 그걸 사 왔다.","일상"],
["pick up","표현","가지러 가다, 태우러 가다","I have to pick up a package.","나는 택배를 찾으러 가야 한다.","일상"],
["drop off","표현","데려다주다, 갖다주다","I drop my sister off at school.","나는 동생을 학교에 데려다준다.","일상"],
["stick to a routine","표현","루틴을 지키다","I try to stick to a routine on weekdays.","나는 평일에는 루틴을 지키려고 한다.","일상"],
["first thing in the morning","표현","아침에 제일 먼저","I check my phone first thing in the morning.","나는 아침에 제일 먼저 휴대폰을 본다.","일상"],
["right before bed","표현","자기 바로 전에","I read a little right before bed.","나는 자기 바로 전에 조금 읽는다.","일상"],
["a couple of times a week","표현","일주일에 두어 번","I cook a couple of times a week.","나는 일주일에 두어 번 요리한다.","일상"],
["in the meantime","표현","그동안에, 그사이에","In the meantime, I cleaned the kitchen.","그사이에 나는 부엌을 치웠다.","일상"],
["from time to time","표현","이따금, 가끔","I meet them from time to time.","나는 이따금 그들을 만난다.","일상"],
["day off","명사","쉬는 날, 휴일","I have a day off on Wednesday.","나는 수요일에 쉬는 날이다.","일상"],
["stay in","표현","집에 있다, 외출하지 않다","I would rather stay in tonight.","나는 오늘 밤은 집에 있고 싶다.","일상"],
["go out","표현","외출하다, 놀러 나가다","We go out for dinner on Fridays.","우리는 금요일에 저녁을 먹으러 나간다.","일상"],
["run out of","표현","다 떨어지다","I ran out of milk this morning.","오늘 아침에 우유가 다 떨어졌다.","일상"],
["keep track of","표현","계속 파악하다, 챙기다","I keep track of my spending in an app.","나는 앱으로 지출을 계속 파악한다.","일상"],
["set aside time","표현","시간을 따로 내다","I set aside time for studying every night.","나는 매일 밤 공부할 시간을 따로 낸다.","일상"],
["squeeze in","표현","짬을 내어 하다","I squeezed in a workout before work.","나는 출근 전에 짬을 내어 운동했다.","일상"],
["be used to","표현","~에 익숙하다","I am used to getting up early now.","나는 이제 일찍 일어나는 데 익숙하다.","일상"],
["used to","표현","예전에는 ~하곤 했다","I used to walk to school every day.","나는 예전에 매일 걸어서 학교에 갔다.","일상"],
["tend to","표현","~하는 편이다","I tend to eat late on weekends.","나는 주말에 늦게 먹는 편이다.","일상"],
["hardly ever","표현","거의 ~하지 않다","I hardly ever watch live TV.","나는 TV를 실시간으로 거의 보지 않는다.","일상"],
["every now and then","표현","가끔씩","Every now and then I cook something new.","가끔씩 나는 새로운 요리를 한다.","일상"],
["nowadays","부사","요즘에는","Nowadays I work from home twice a week.","요즘에는 일주일에 두 번 재택근무를 한다.","일상"],
["back then","표현","그 당시에는","Back then I did not have a car.","그 당시에 나는 차가 없었다.","일상"],
["as soon as","표현","~하자마자","I called her as soon as I got home.","나는 집에 도착하자마자 그녀에게 전화했다.","일상"],
["on a regular basis","표현","규칙적으로","I exercise on a regular basis.","나는 규칙적으로 운동한다.","일상"],
["the whole day","표현","하루 종일","I stayed home the whole day.","나는 하루 종일 집에 있었다.","일상"],
["by myself","표현","혼자서","I usually have lunch by myself.","나는 보통 혼자 점심을 먹는다.","일상"],
["in a hurry","표현","급히, 서둘러","I left in a hurry this morning.","나는 오늘 아침 급하게 나왔다.","일상"],
["put away","표현","치워 두다, 넣어 두다","I put away the dishes after dinner.","나는 저녁 후에 그릇을 치워 둔다.","일상"],

// ── 집·동네 ──
["within walking distance","표현","걸어갈 수 있는 거리에","The park is within walking distance.","공원은 걸어갈 수 있는 거리에 있다.","집·동네"],
["right around the corner","표현","바로 근처에","There is a cafe right around the corner.","바로 근처에 카페가 있다.","집·동네"],
["residential area","명사","주택가","I live in a quiet residential area.","나는 조용한 주택가에 산다.","집·동네"],
["crowded","형용사","붐비는, 사람이 많은","The street gets crowded on weekends.","그 거리는 주말이면 붐빈다.","집·동네"],
["spacious","형용사","넓은, 널찍한","The living room is surprisingly spacious.","거실이 생각보다 널찍하다.","집·동네"],
["cozy","형용사","아늑한","It is a small but cozy apartment.","작지만 아늑한 아파트다.","집·동네"],
["convenient","형용사","편리한","Living near the subway is convenient.","지하철 근처에 사는 건 편리하다.","집·동네"],
["run-down","형용사","낡은, 허름한","The building looked a bit run-down.","그 건물은 조금 낡아 보였다.","집·동네"],
["stop by","표현","잠깐 들르다","I stop by the bakery on my way home.","나는 집에 가는 길에 빵집에 들른다.","집·동네"],
["hang out","표현","어울려 놀다, 시간을 보내다","We hang out at that cafe every week.","우리는 매주 그 카페에서 시간을 보낸다.","집·동네"],
["atmosphere","명사","분위기","The place has a relaxed atmosphere.","그곳은 편안한 분위기다.","집·동네"],
["move in","표현","이사 들어오다","I moved in about two years ago.","나는 약 2년 전에 이사 왔다.","집·동네"],
["move out","표현","이사 나가다","They moved out last month.","그들은 지난달에 이사 나갔다.","집·동네"],
["rent","명사","월세, 집세","The rent went up this year.","올해 월세가 올랐다.","집·동네"],
["landlord","명사","집주인","My landlord fixed the heater quickly.","집주인이 난방기를 빨리 고쳐 줬다.","집·동네"],
["studio apartment","명사","원룸","I live in a small studio apartment.","나는 작은 원룸에 산다.","집·동네"],
["rooftop","명사","옥상","We had dinner on the rooftop.","우리는 옥상에서 저녁을 먹었다.","집·동네"],
["balcony","명사","발코니, 베란다","I keep my plants on the balcony.","나는 발코니에 화분을 둔다.","집·동네"],
["furniture","명사","가구","I bought most of my furniture online.","나는 가구를 대부분 온라인으로 샀다.","집·동네"],
["appliance","명사","가전제품","The kitchen came with all the appliances.","부엌에 가전제품이 다 딸려 있었다.","집·동네"],

/* ─────────── 상태 ─────────── */
var KEY = 'opic_deck_v1';
var INTERVALS = [0, 1, 2, 4, 8, 16];
var DAY = 86400000;
var TOPICS = ['일상','집·동네','취미','미디어','운동','음식','여행','직장','성격·감정','롤플레이','기기','심화'];
var MODES = [['flash','플래시카드'],['choice','4지선다'],['spell','스펠링'],['mix','섞어서']];

var S = {
  deck: [], view: 'study', mode: 'mix', topic: '전체',
  queue: [], idx: 0, revealed: false, picked: null, result: null,
  typed: '', session: {right:0, wrong:0, done:0},
  query: '', shown: 40, msg: '', msgWarn: false
};

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function isPhrase(w){ return /[\s-]/.test(w); }
function shuffle(a){
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function makeCard(r, id){
  return { id:id, word:r[0], pos:r[1], meaning:r[2], example:r[3], exampleKo:r[4],
           topic:r[5], box:0, due:0, right:0, wrong:0 };
}

/* ─────────── 저장 ─────────── */
function load(){
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
  if (saved && saved.length){
    var have = {};
    saved.forEach(function(c){ have[c.word.toLowerCase()] = 1; });
    var fresh = [];
    WORDS.forEach(function(r, i){
      if (!have[r[0].toLowerCase()]) fresh.push(makeCard(r, 's' + i));
    });
    S.deck = saved.concat(fresh);
  } else {
    S.deck = WORDS.map(function(r, i){ return makeCard(r, 's' + i); });
  }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S.deck)); }
  catch(e){ S.msg = '진도를 저장하지 못했습니다.'; S.msgWarn = true; }
}

/* ─────────── 조회 ─────────── */
function scoped(){
  if (S.topic === '전체') return S.deck;
  return S.deck.filter(function(c){ return c.topic === S.topic; });
}
function dueList(){
  var now = Date.now();
  return scoped().filter(function(c){ return c.due <= now; });
}
function cardById(id){
  for (var i = 0; i < S.deck.length; i++) if (S.deck[i].id === id) return S.deck[i];
  return null;
}
function current(){ return S.queue.length ? cardById(S.queue[S.idx]) : null; }

function cardMode(c){
  var phrase = isPhrase(c.word);
  if (S.mode !== 'mix') return (S.mode === 'spell' && phrase) ? 'choice' : S.mode;
  var pool = phrase ? ['flash','choice'] : ['flash','choice','spell'];
  var h = 0, k = c.id + '#' + S.idx;
  for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) | 0;
  return pool[Math.abs(h) % pool.length];
}

var choiceCache = null;
function choicesFor(c){
  if (choiceCache && choiceCache.id === c.id + '#' + S.idx) return choiceCache.list;
  var others = shuffle(S.deck.filter(function(x){ return x.id !== c.id; })).slice(0, 3);
  var list = shuffle([c].concat(others)).map(function(x){ return {id:x.id, text:x.meaning}; });
  choiceCache = { id: c.id + '#' + S.idx, list: list };
  return list;
}

/* ─────────── 동작 ─────────── */
function speak(text){
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.92;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
function resetCard(){
  S.revealed = false; S.picked = null; S.result = null; S.typed = ''; choiceCache = null;
}
function startSession(){
  var pool = dueList();
  if (!pool.length) pool = scoped();
  if (!pool.length) return;
  S.queue = shuffle(pool).slice(0, 20).map(function(c){ return c.id; });
  S.idx = 0; S.session = {right:0, wrong:0, done:0};
  resetCard(); render();
}
function grade(ok){
  if (S.result) return;
  var c = current();
  S.result = ok ? 'right' : 'wrong';
  S.revealed = true;
  S.session.done++;
  if (ok) S.session.right++; else S.session.wrong++;
  c.box = ok ? Math.min(5, c.box + 1) : 0;
  c.due = Date.now() + INTERVALS[c.box] * DAY;
  if (ok) c.right++; else c.wrong++;
  save(); render();
}
function nextCard(){
  if (S.idx + 1 >= S.queue.length){ S.queue = []; S.idx = 0; }
  else { S.idx++; }
  resetCard(); render();
}
function addWord(word, meaning, example, exampleKo, topic){
  word = word.trim();
  if (!word) return '단어를 입력하세요.';
  var dup = S.deck.some(function(c){ return c.word.toLowerCase() === word.toLowerCase(); });
  if (dup) return '"' + word + '"은(는) 이미 있습니다.';
  S.deck.push({
    id: 'u' + Date.now() + Math.floor(Math.random()*1000),
    word: word, pos: '추가', meaning: meaning.trim() || '(뜻 없음)',
    example: example.trim(), exampleKo: exampleKo.trim(), topic: topic,
    box: 0, due: 0, right: 0, wrong: 0, custom: true
  });
  save();
  return null;
}

/* ─────────── 화면 ─────────── */
function render(){
  var h = '';
  h += '<header class="bar"><div class="brand"><span class="chip"></span>오픽 단어장</div><nav>';
  [['study','학습'],['list','목록'],['add','추가']].forEach(function(v){
    h += '<button data-view="' + v[0] + '"' + (S.view === v[0] ? ' class="on"' : '') + '>' + v[1] + '</button>';
  });
  h += '</nav></header>';

  if (S.view === 'study') h += current() ? viewCard() : viewHome();
  else if (S.view === 'list') h += viewList();
  else h += viewAdd();

  document.getElementById('app').innerHTML = h;
  bind();
}

function viewHome(){
  var due = dueList().length, sc = scoped();
  var mastered = sc.filter(function(c){ return c.box >= 5; }).length;
  var h = '<section class="pane">';
  h += '<div class="today"><p class="count">' + due + '<span>개</span></p><p class="today-sub">' +
       (due ? (S.topic === '전체' ? '오늘' : esc(S.topic) + ' 주제에서') + ' 복습할 차례가 된 표현이에요.'
            : '복습할 차례인 표현이 없어요. 미리 훑어볼 수 있습니다.') + '</p></div>';

  h += '<div class="chips"><button class="chipbtn' + (S.topic === '전체' ? ' on' : '') +
       '" data-topic="전체">전체<b>' + S.deck.length + '</b></button>';
  TOPICS.forEach(function(t){
    var n = S.deck.filter(function(c){ return c.topic === t; }).length;
    if (!n) return;
    h += '<button class="chipbtn' + (S.topic === t ? ' on' : '') + '" data-topic="' + esc(t) + '">' +
         esc(t) + '<b>' + n + '</b></button>';
  });
  h += '</div>';

  h += '<div class="stats"><div><b>' + sc.length + '</b><span>표현</span></div>' +
       '<div><b>' + mastered + '</b><span>외웠음</span></div>' +
       '<div><b>' + (sc.length - mastered) + '</b><span>외우는 중</span></div></div>';

  h += '<div class="chips">';
  MODES.forEach(function(m){
    h += '<button class="chipbtn' + (S.mode === m[0] ? ' on' : '') + '" data-mode="' + m[0] + '">' + m[1] + '</button>';
  });
  h += '</div>';

  if (S.session.done) h += '<p class="last">방금 ' + S.session.done + '개 학습 · 맞음 ' +
       S.session.right + ' · 틀림 ' + S.session.wrong + '</p>';
  if (S.msg) h += '<p class="msg' + (S.msgWarn ? ' warn' : '') + '">' + esc(S.msg) + '</p>';

  h += '<button class="go" data-act="start"' + (sc.length ? '' : ' disabled') + '>학습 시작</button>';
  h += '<button class="ghost" data-act="reset">학습 기록 초기화</button>';
  return h + '</section>';
}

function viewCard(){
  var c = current(), m = cardMode(c);
  var h = '<section class="pane">';
  h += '<div class="progress"><div class="track"><div class="fill" style="width:' +
       (S.idx / S.queue.length * 100) + '%"></div></div><span>' + (S.idx + 1) + ' / ' + S.queue.length + '</span></div>';

  h += '<article class="card ' + (S.result || '') + '">';
  h += '<p class="pos">' + esc(c.topic) + ' · ' + esc(c.pos) + ' · ' +
       (c.box >= 5 ? '외웠음' : (c.box + 1) + '단계') + '</p>';

  if (m === 'spell'){
    h += '<p class="kmean">' + esc(c.meaning) + '</p>';
    h += '<p class="hint">' + esc(c.word[0]) + new Array(c.word.length).join('·') + '</p>';
    h += '<input class="spell" id="spellin" autocapitalize="none" autocorrect="off" spellcheck="false" ' +
         'placeholder="철자를 입력하세요" value="' + esc(S.typed) + '"' + (S.result ? ' disabled' : '') + '>';
    if (S.result === 'wrong') h += '<p class="answer">정답: ' + esc(c.word) + '</p>';
    if (!S.result) h += '<button class="go sm" data-act="check">확인</button>';
  } else {
    h += '<div class="wordrow"><p class="word">' + esc(c.word) +
         '</p><button class="spk" data-say="' + esc(c.word) + '" aria-label="발음 듣기">🔊</button></div>';
  }

  if (m === 'flash'){
    h += '<div class="sheet-wrap" data-act="reveal"><p class="kmean red">' + esc(c.meaning) + '</p>' +
         '<div class="sheet' + (S.revealed ? ' off' : '') + '"><span>탭해서 뜻 보기</span></div></div>';
  }

  if (m === 'choice'){
    h += '<div class="choices">';
    choicesFor(c).forEach(function(o){
      var cls = 'choice';
      if (S.picked){
        if (o.id === c.id) cls += ' right';
        else if (o.id === S.picked) cls += ' wrong';
      }
      h += '<button class="' + cls + '" data-pick="' + o.id + '"' + (S.picked ? ' disabled' : '') + '>' +
           esc(o.text) + '</button>';
    });
    h += '</div>';
  }

  if (S.revealed && c.example){
    h += '<div class="ex"><p class="ex-en" data-say="' + esc(c.example) + '">' + esc(c.example) +
         '</p><p class="ex-ko">' + esc(c.exampleKo) + '</p></div>';
  }
  h += '</article>';

  if (m === 'flash' && S.revealed && !S.result){
    h += '<div class="judge"><button class="miss" data-grade="0">다시 볼래요</button>' +
         '<button class="hit" data-grade="1">알고 있었어요</button></div>';
  }
  if (S.result) h += '<button class="go" data-act="next">' +
       (S.idx + 1 >= S.queue.length ? '학습 마치기' : '다음') + '</button>';
  if (!S.result && m !== 'flash') h += '<button class="ghost" data-act="quit">그만하기</button>';
  return h + '</section>';
}

function viewList(){
  var q = S.query.trim().toLowerCase();
  var rows = S.deck.filter(function(c){
    return !q || c.word.toLowerCase().indexOf(q) >= 0 || c.meaning.indexOf(q) >= 0;
  });
  var h = '<section class="pane">';
  h += '<input class="search" id="searchin" placeholder="단어나 뜻으로 찾기" value="' + esc(S.query) + '">';
  h += '<p class="lead">' + rows.length + '개 표시 중 (전체 ' + S.deck.length + '개)</p><ul class="list">';
  rows.slice(0, S.shown).forEach(function(c){
    h += '<li><details><summary><span class="lw">' + esc(c.word) + '</span><span class="rt">' +
         '<span class="tg">' + esc(c.topic) + '</span><span class="dot b' + c.box + '"></span></span></summary>' +
         '<p class="lm">' + esc(c.pos) + ' · ' + esc(c.meaning) + '</p>' +
         (c.example ? '<p class="ex-en small">' + esc(c.example) + '</p>' +
                      '<p class="ex-ko small">' + esc(c.exampleKo) + '</p>' : '') +
         '<div class="lact"><button class="ghost" data-say="' + esc(c.word) + '">발음 듣기</button>' +
         '<button class="ghost" data-del="' + c.id + '">지우기</button></div></details></li>';
  });
  h += '</ul>';
  if (rows.length > S.shown) h += '<button class="ghost more" data-act="more">더 보기</button>';
  return h + '</section>';
}

function viewAdd(){
  var h = '<section class="pane">';
  h += '<p class="lead">내 단어를 직접 넣습니다. 뜻만 적어도 되고, 예문은 비워 둬도 됩니다.</p>';
  h += '<div class="field"><label>단어 또는 표현</label><input id="a-word" autocapitalize="none" placeholder="look forward to"></div>';
  h += '<div class="field"><label>뜻</label><input id="a-mean" placeholder="~를 기대하다"></div>';
  h += '<div class="field"><label>예문 (선택)</label><input id="a-ex" autocapitalize="none" placeholder="I look forward to Fridays."></div>';
  h += '<div class="field"><label>예문 번역 (선택)</label><input id="a-exko" placeholder="나는 금요일을 기대한다."></div>';
  h += '<div class="chips" id="a-topics">';
  TOPICS.forEach(function(t){
    h += '<button class="chipbtn' + (S.addTopic === t ? ' on' : '') + '" data-atopic="' + esc(t) + '">' + esc(t) + '</button>';
  });
  h += '</div><button class="go" data-act="add">단어장에 넣기</button>';
  h += '<div class="divider"></div>';
  h += '<p class="lead">여러 개를 한 번에 넣으려면 한 줄에 하나씩, <b>단어, 뜻</b> 형식으로 붙여 넣으세요.</p>';
  h += '<div class="field"><textarea id="a-bulk" autocapitalize="none" placeholder="look forward to, ~를 기대하다&#10;show up, 나타나다"></textarea></div>';
  h += '<button class="go" data-act="bulk">한꺼번에 넣기</button>';
  if (S.msg) h += '<p class="msg' + (S.msgWarn ? ' warn' : '') + '">' + esc(S.msg) + '</p>';
  return h + '</section>';
}

/* ─────────── 이벤트 ─────────── */
function bind(){
  var app = document.getElementById('app');

  app.querySelectorAll('[data-view]').forEach(function(b){
    b.onclick = function(){ S.view = b.dataset.view; S.msg = ''; render(); };
  });
  app.querySelectorAll('[data-topic]').forEach(function(b){
    b.onclick = function(){ S.topic = b.dataset.topic; render(); };
  });
  app.querySelectorAll('[data-mode]').forEach(function(b){
    b.onclick = function(){ S.mode = b.dataset.mode; render(); };
  });
  app.querySelectorAll('[data-say]').forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); speak(b.dataset.say); };
  });
  app.querySelectorAll('[data-grade]').forEach(function(b){
    b.onclick = function(){ grade(b.dataset.grade === '1'); };
  });
  app.querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick = function(){ S.picked = b.dataset.pick; grade(b.dataset.pick === current().id); };
  });
  app.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick = function(){
      if (!confirm('이 단어를 지울까요?')) return;
      S.deck = S.deck.filter(function(c){ return c.id !== b.dataset.del; });
      save(); render();
    };
  });
  app.querySelectorAll('[data-atopic]').forEach(function(b){
    b.onclick = function(){ S.addTopic = b.dataset.atopic; render(); };
  });

  var sheet = app.querySelector('[data-act="reveal"]');
  if (sheet) sheet.onclick = function(){ S.revealed = true; render(); };

  var spellin = app.querySelector('#spellin');
  if (spellin){
    spellin.oninput = function(){ S.typed = spellin.value; };
    spellin.onkeydown = function(e){ if (e.key === 'Enter') doCheck(); };
    if (!S.result) setTimeout(function(){ spellin.focus(); }, 30);
  }

  var searchin = app.querySelector('#searchin');
  if (searchin){
    searchin.oninput = function(){
      S.query = searchin.value; S.shown = 40;
      var pos = searchin.selectionStart;
      render();
      var el = document.getElementById('searchin');
      el.focus(); el.setSelectionRange(pos, pos);
    };
  }

  app.querySelectorAll('[data-act]').forEach(function(b){
    var a = b.dataset.act;
    if (a === 'reveal') return;
    b.onclick = function(){
      if (a === 'start') startSession();
      else if (a === 'next') nextCard();
      else if (a === 'quit'){ S.queue = []; resetCard(); render(); }
      else if (a === 'check') doCheck();
      else if (a === 'more'){ S.shown += 40; render(); }
      else if (a === 'reset'){
        if (!confirm('모든 학습 기록과 직접 넣은 단어를 지우고 처음부터 시작할까요?')) return;
        S.deck = WORDS.map(function(r, i){ return makeCard(r, 's' + i); });
        S.queue = []; S.session = {right:0, wrong:0, done:0};
        save(); render();
      }
      else if (a === 'add'){
        var err = addWord(
          document.getElementById('a-word').value,
          document.getElementById('a-mean').value,
          document.getElementById('a-ex').value,
          document.getElementById('a-exko').value,
          S.addTopic
        );
        S.msgWarn = !!err;
        S.msg = err || '추가했습니다.';
        render();
      }
      else if (a === 'bulk'){
        var lines = document.getElementById('a-bulk').value.split('\n');
        var n = 0, skipped = 0;
        lines.forEach(function(ln){
          if (!ln.trim()) return;
          var i = ln.indexOf(',');
          if (i < 0) i = ln.indexOf('\t');
          var w = i < 0 ? ln : ln.slice(0, i);
          var mn = i < 0 ? '' : ln.slice(i + 1);
          if (addWord(w, mn, '', '', S.addTopic)) skipped++; else n++;
        });
        S.msgWarn = false;
        S.msg = n + '개 추가' + (skipped ? ', ' + skipped + '개 건너뜀 (중복)' : '');
        render();
      }
    };
  });
}

function doCheck(){
  if (!S.typed.trim() || S.result) return;
  grade(S.typed.trim().toLowerCase() === current().word.toLowerCase());
}

/* ─────────── 시작 ─────────── */
S.addTopic = '일상';
load();
render();
</script>
